notes: >-
  DinMo publishes a product changelog / "what's new" feed at news.dinmo.com. Entries
  are titled and categorized (New, Improvement, New integration) and authored, but
  the index carries no machine-readable per-entry dates and there is no RSS/Atom
  feed, so the recent window below is captured in reverse-chronological order
  without dates. This is a product changelog, not a versioned API changelog: no
  entry in the current window touches the Personalization API, and no breaking
  changes are announced against a version.
entries:
