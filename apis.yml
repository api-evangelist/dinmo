aid: dinmo
name: DinMo
description: >-
  DinMo is a composable Customer Data Platform (CDP) that turns a cloud data
  warehouse into a marketing activation engine. It connects directly to Snowflake,
  Google BigQuery, Databricks, Amazon Redshift, PostgreSQL, Microsoft Fabric, and
  ClickHouse, lets non-technical teams model customer data and build no-code
  segments, and activates those audiences to more than a hundred destination
  platforms (ad networks, CRMs, marketing and messaging tools) via Reverse ETL
  with a zero-data-copy architecture built for GDPR and FADP compliance. DinMo
  also exposes a Personalization API for retrieving activated model records in
  real time, plus AI predictions (LTV, churn), identity resolution, a Customer Hub,
  and event tracking. The company is Paris-based and backed by Seedcamp.
