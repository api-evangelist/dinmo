metering:
  unit: Active Contact
  definition: >-
    A "Synced Contact" is a primary key synced to at least one platform during the
    month. An "Active Contact" is the combination of a Synced Contact and a
    destination — the same contact sent to two destinations counts twice; the same
    contact synced repeatedly to one destination in a month counts once.
  secondary_unit: Destination
  destination_definition: >-
    A destination is a specific configuration within a platform (Facebook Custom
    Audiences and Facebook Conversions API are two destinations, not one).
